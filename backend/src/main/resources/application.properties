spring.application.name=attribution-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/attribution}
spring.datasource.username=${DATABASE_USERNAME:attribution}
spring.datasource.password=${DATABASE_PASSWORD:local_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health,info
